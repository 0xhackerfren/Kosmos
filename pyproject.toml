[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kosmos-worlds"
version = "0.1.0"
description = "Reproducible worlds for evolving agent populations"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
kosmos = "kosmos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
