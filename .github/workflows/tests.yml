name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - run: python -m kosmos run --config examples/habitat.json --steps 30 --output runs/ci
      - run: python -m kosmos resume runs/ci/checkpoint.json --steps 10 --output runs/ci-resumed
      - run: python examples/custom_world.py run --config examples/custom_world.json --steps 20 --output runs/custom
      - run: python examples/custom_world.py resume runs/custom/checkpoint.json --steps 5 --output runs/custom-resumed
